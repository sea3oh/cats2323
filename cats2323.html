<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Какой ты сегодня котик?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2.5rem;
        }

        .cat-container {
            width: 100%;
            max-width: 500px;
            height: 400px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .cat-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
        }

        button:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Какой ты сегодня котик?</h1>

    <div class="cat-container">
        <img id="catImage" class="cat-image" src="" alt="Случайный котик">
    </div>

    <button onclick="showRandomCat()">Другой котик 🐾</button>

    <script>
        // Укажи здесь точное количество картинок, которое ты сохранил в папку "cats"
        const totalCats = 5; 

        function showRandomCat() {
            const imageElement = document.getElementById('catImage');
            
            // Генерируем случайное число от 1 до общего количества котиков
            const randomNumber = Math.floor(Math.random() * totalCats) + 1;
            
            // Путь к локальной картинке в папке cats
            imageElement.src = 'cats/' + randomNumber + '.jpg';
        }

        // Запускаем при открытии страницы
        showRandomCat();
    </script>

</body>
</html>
