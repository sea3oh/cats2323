<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Какой ты сегодня котик?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2.5rem;
            max-width: 600px;
        }

        /* Контейнер для котика (изначально скрыт) */
        .cat-container {
            display: none; 
            width: 100%;
            max-width: 500px;
            height: 400px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .cat-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        button {
            padding: 14px 28px;
            font-size: 1.2rem;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
        }

        button:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        /* Кнопка повтора (изначально скрыта) */
        #nextButton {
            display: none;
        }
    </style>
</head>
<body>

    <h1 id="mainTitle">Хочешь узнать, какой ты сегодня котик?</h1>

    <div id="catContainer" class="cat-container">
        <img id="catImage" class="cat-image" src="" alt="Случайный котик">
    </div>

    <!-- Стартовая кнопка -->
    <button id="startButton" onclick="revealCat()">Узнать! 🐾</button>

    <!-- Кнопка «Другой котик» -->
    <button id="nextButton" onclick="showRandomCat()">Другой котик 🔄</button>

    <script>
        // Укажи здесь точное количество картинок в твоей папке "cats"
        const totalCats = 10; 

        function revealCat() {
            // Исправлено: убрана опечатка .style.style
            document.getElementById('startButton').style.display = 'none';
            document.getElementById('nextButton').style.display = 'block';
            document.getElementById('catContainer').style.display = 'flex';
            document.getElementById('mainTitle').innerText = 'Какой ты сегодня котик?';
            
            showRandomCat();
        }

        function showRandomCat() {
            const imageElement = document.getElementById('catImage');
            const randomNumber = Math.floor(Math.random() * totalCats) + 1;
            
            // Если картинки не отображаются на GitHub Pages, 
            // проверь, чтобы расширение файла (.jpg или .JPG) точно совпадало!
            imageElement.src = 'cats/' + randomNumber + '.jpg';
        }
    </script>

</body>
</html>
